<div class="content-container">
    <form>
        <label for="email">Login</label><br>
        <input class="input-simples" id="email" name="email" type="email" placeholder="Digite seu email" 
            (keyup)="teclaDigitada($event)"
        />
        <label for="input-senha">Senha</label><br>
        <input class="input-simples" id="input-senha" name="input-senha" type="password"
            placeholder="Digite sua senha" />
        <button class="input-submeter">
            Confirmar
        </button>
    </form>
</div>
